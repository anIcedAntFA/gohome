# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 50%
        threshold: 5%

    patch:
      default:
        target: 60%
        threshold: 10%

# Ignore patterns - exclude from coverage
ignore:
  - "cmd/gohome/main.go"
  - "**/*_test.go"
  - "**/example_*.go"
  - "scripts/**"
  - "npm-package/**"

# Comment on PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
